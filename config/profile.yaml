  # you can use HTML syntax here (e.g. <br/>, <a>, <strong>, ...)
  biography: |
    Hi! I'm <strong>Jeffrey (Youhui) Wang</strong>, currently an undergraduate student at <strong>Cornell University</strong>, previously a visiting undergraduate scholar at <strong>Harvard College</strong>.
    <div style="height: 1rem;"></div>
    Currently, I work as a researcher at the Stanford Vision and Learning Lab, fortunately advised by <a class="bio-link" href="https://qingh097.github.io/" target="_blank" rel="noopener noreferrer">Dr. Huang Huang</a>, <a class="bio-link" href="https://jiajunwu.com/" target="_blank" rel="noopener noreferrer">Prof. Jiajun Wu</a>, and <a class="bio-link" href="https://profiles.stanford.edu/fei-fei-li" target="_blank" rel="noopener noreferrer">Prof. Fei-Fei Li</a>, and at the Harvard Edge Computing Lab, fortunately advised by <a class="bio-link" href="https://jasonjabbour.github.io/" target="_blank" rel="noopener noreferrer">Jason Jabbour</a> and <a class="bio-link" href="https://edge.seas.harvard.edu/people/vijay-janapa-reddi" target="_blank" rel="noopener noreferrer">Prof. Vijay Janapa Reddi</a>. At Cornell, I also collaborate closely with <a class="bio-link" href="https://kuanfang.github.io/" target="_blank" rel="noopener noreferrer">Prof. Kuan Fang</a>.
    <div style="height: 1rem;"></div>
    Currently, my research focuses on:
    <ul style="margin-top: 0.5rem; margin-bottom: 1rem; padding-left: 1.5rem;">
      <li><strong>Agentic Robotics and Frameworks</strong></li>
      <li><strong>Robot Learning, Perception, and Control</strong></li>
      <li><strong>Robot Data Generation</strong></li>
    </ul>
    My broader goal is to build <strong>generalist robots</strong> as intelligent as human and capable of learning and performing a wide range of real-world tasks, through a variety of methods.
    <div style="height: 1rem;"></div>
    Outside of work, I enjoy playing basketball, tennis, golf, ice hockey, squash, and traveling. Feel free to reach out for research opportunities, collaborations, or just a chat!
