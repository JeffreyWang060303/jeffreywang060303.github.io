# =====================================================
# Projects & Publications data displayed on the Projects page.
#
# One unified list — projects and publications are entries in the same
# array, in the same file, so you control the exact display order by
# reordering entries here (no automatic sorting by date).
#
# ✔ `authorName`: your name exactly as it appears in author lists — it gets
#    bolded automatically wherever it shows up.
#
# Each entry supports:
#   - `title` (required): the name shown on the website.
#   - `authors`: full author list for a paper, comma-separated. Add a trailing
#      marker like "*" or "†" to a name and use `authorNotes` to explain it
#      (e.g. "* Equal contribution"). Shown in place of `advisors` when set.
#   - `authorNotes`: footnote explaining any markers used in `authors`.
#   - `advisors`: supervisors/advisors, comma-separated. Shown only when
#      `authors` is not set.
#   - `role`: your role / the lab or institution (optional, for your own reference).
#   - `duration` / `year`: time period or publication year (optional, for your
#      own reference — no longer used to sort the list).
#   - `venue`: conference or journal name (optional, for your own reference).
#   - `description`: shown under the authors line if present.
#   - `tools`: array of technologies/tools used (optional, for your own reference).
#   - `github`: link to a code repository, if any.
#   - `paper`: link to the paper/PDF, if any.
#   - `website`: link to a project website (when it's not a code repo), if any.
#   - `image`: preview image path (from /public/images/), if any.
#   - `featured`:
#       true  → shown by default in the "Selected" view
#       false → shown only in the "All" view
# =====================================================

